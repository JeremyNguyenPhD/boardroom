<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline';">
  <title>Boardroom Popup</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: #15171a;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 36px) minmax(160px, 1fr) repeat(2, 52px);
      gap: 6px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #d7dce2;
      background: #ffffff;
    }

    @media (max-width: 430px) {
      .toolbar {
        grid-template-columns: repeat(3, 36px) minmax(0, 1fr);
      }

      #address-form {
        grid-column: 1 / -1;
      }
    }

    button {
      height: 32px;
      border: 1px solid #b9c0c9;
      border-radius: 6px;
      background: #ffffff;
      color: #15171a;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      color: #9aa2ad;
      cursor: default;
      background: #f0f2f4;
    }

    form {
      min-width: 0;
    }

    #address {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #aeb6c1;
      border-radius: 6px;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #15171a;
      background: #ffffff;
    }

    #error {
      min-height: 18px;
      padding: 2px 10px;
      font-size: 12px;
      color: #9b1c1c;
      background: #fff7f7;
      border-bottom: 1px solid #eed3d3;
    }

    #error:empty {
      display: none;
    }

    webview {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="back" type="button" title="Back" aria-label="Back">&#8592;</button>
    <button id="forward" type="button" title="Forward" aria-label="Forward">&#8594;</button>
    <button id="reload" type="button" title="Reload" aria-label="Reload">&#8635;</button>
    <form id="address-form">
      <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="URL">
    </form>
    <button id="copy-url" type="button" title="Copy URL">Copy</button>
    <button id="open-url" type="button" title="Open in browser">Open</button>
  </div>
  <div id="error" role="status"></div>
  <webview id="popup-webview" allowpopups></webview>

  <script src="./lib/url-utils.js"></script>
  <script src="./lib/popup-controls.js"></script>
  <script src="./lib/popup-page.js"></script>
</body>
</html>
